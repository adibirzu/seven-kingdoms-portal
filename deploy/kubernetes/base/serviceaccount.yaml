apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability-app
  namespace: observability-app
  labels:
    app.kubernetes.io/name: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observability-app
  namespace: observability-app
  labels:
    app.kubernetes.io/name: observability
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observability-app
  namespace: observability-app
  labels:
    app.kubernetes.io/name: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: observability-app
subjects:
  - kind: ServiceAccount
    name: observability-app
    namespace: observability-app
