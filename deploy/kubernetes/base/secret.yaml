apiVersion: v1
kind: Secret
metadata:
  name: observability-secrets
  namespace: observability-app
  labels:
    app.kubernetes.io/name: observability
type: Opaque
# Values must be base64-encoded. Generate with:
#   echo -n "your-value" | base64
#
# Or use kubectl create secret:
#   kubectl create secret generic observability-secrets \
#     --from-literal=OCI_APM_ENDPOINT=https://... \
#     --from-literal=OCI_APM_PUBLIC_DATAKEY=... \
#     --from-literal=OCI_APM_PRIVATE_DATAKEY=... \
#     --from-literal=OCI_COMPARTMENT_OCID=ocid1... \
#     --from-literal=PORTAL_JWT_SECRET=your-secret \
#     -n observability-app
stringData:
  # ── OCI APM ─────────────────────────
  OCI_APM_ENDPOINT: ""
  OCI_APM_PUBLIC_DATAKEY: ""
  OCI_APM_PRIVATE_DATAKEY: ""

  # ── OCI Logging ─────────────────────
  OCI_LOG_OCID: ""
  OCI_LOG_GROUP_OCID: ""

  # ── OCI Monitoring ──────────────────
  OCI_COMPARTMENT_OCID: ""

  # ── Portal ──────────────────────────
  PORTAL_JWT_SECRET: "seven-kingdoms-secret-key-2024"
