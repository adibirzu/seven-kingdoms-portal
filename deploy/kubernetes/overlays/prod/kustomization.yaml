apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability-app

resources:
  - ../../base

commonLabels:
  environment: production

# Override with your OCIR registry:
#   kustomize edit set image observability-app=fra.ocir.io/NAMESPACE/observability-app:stable
images:
  - name: observability-app
    newName: observability-app
    newTag: stable

# Production-specific patches
patches:
  # Increase replicas and resources for production
  - target:
      kind: Deployment
      name: observability-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"

  # HPA configuration for production
  - target:
      kind: HorizontalPodAutoscaler
      name: observability-app
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20

configMapGenerator:
  - name: observability-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - APP_WORKERS=4
