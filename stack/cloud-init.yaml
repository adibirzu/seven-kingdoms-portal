#cloud-config
# Seven Kingdoms Portal — Stack Deployer Cloud-init
#
# Runs on the deployer VM after ORM creates it. Installs prerequisites,
# clones the repo, writes .env.local from Terraform outputs, and runs
# deploy.py to orchestrate Docker build, OCIR push, app deployment,
# GOAD AD provisioning, observability setup, and WAF configuration.

package_update: true
packages:
  - git
  - python39
  - python39-pip
  - python39-devel
  - jq

write_files:
  - path: /home/opc/.ssh/deploy_key
    permissions: '0600'
    owner: opc:opc
    content: |
      ${deploy_private_key}

  - path: /opt/skp/.env.local
    permissions: '0600'
    owner: opc:opc
    content: |
      # Auto-generated by ORM Stack
      OCI_PROFILE=DEFAULT
      OCI_REGION=${region}
      OCI_AUTH_MODE=instance_principal
      OCI_COMPARTMENT_ID=${compartment_ocid}
      OCI_TENANCY_ID=${tenancy_ocid}
      OCI_NAMESPACE=${oci_namespace}
      DEPLOY_GOAD=${deploy_goad}
      DEPLOY_WAF=${deploy_waf}
      APP_DEPLOY_MODE=${app_deploy_mode}
      APP_PORT=${app_port}
      APP_WORKERS=4
      ENVIRONMENT=production
      PORTAL_JWT_SECRET='${jwt_secret}'
      SSH_PUBLIC_KEY_PATH=~/.ssh/authorized_keys
      SSH_PRIVATE_KEY_PATH=~/.ssh/deploy_key
      VCN_OCID=${vcn_ocid}
      PUBLIC_SUBNET_OCID=${public_subnet_ocid}
      PRIVATE_SUBNET_OCID=${private_subnet_ocid}
      APP_NSG_OCID=${app_nsg_ocid}
      LB_NSG_OCID=${lb_nsg_ocid}
      PRIVATE_ROUTE_TABLE_OCID=${private_rt_ocid}
      APP_LPG_OCID=${app_lpg_ocid}
      OKE_CLUSTER_OCID=${oke_cluster_ocid}
      GOAD_JUMPBOX_IP=${goad_jumpbox_ip}
      GOAD_VCN_OCID=${goad_vcn_ocid}
      GOAD_LPG_OCID=${goad_lpg_ocid}
      GOAD_DC_KINGSLANDING_IP=192.168.56.10
      GOAD_DC_WINTERFELL_IP=192.168.56.11
      GOAD_DC_MEEREEN_IP=192.168.56.12
      GOAD_MSSQL_CASTELBLACK_HOST=192.168.56.22
      GOAD_MSSQL_BRAAVOS_HOST=192.168.56.23
      GOAD_MSSQL_USER=sa
      GOAD_MSSQL_PASSWORD=password123!
      OCIR_URL=${region}.ocir.io/${oci_namespace}
      DOCKER_IMAGE_TAG=latest
%{ if app_deploy_mode_is_container == "true" ~}

  - path: /root/.docker/config.json
    permissions: '0600'
    content: '${ocir_docker_config}'

  - path: /home/opc/.docker/config.json
    permissions: '0600'
    owner: opc:opc
    content: '${ocir_docker_config}'
%{ endif ~}

runcmd:
  # --- Install Docker ---
  - dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
  - dnf install -y docker-ce docker-ce-cli containerd.io
  - systemctl enable --now docker
  - usermod -aG docker opc

  # --- Install OCI CLI ---
  - su - opc -c 'curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh | bash -s -- --accept-all-defaults'

  # --- Install kubectl (for OKE mode) ---
  - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
  - install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
  - rm -f kubectl

  # --- Clone the Seven Kingdoms Portal repository ---
  - git clone https://github.com/adibirzu/seven-kingdoms-portal.git /opt/skp || true
  - chown -R opc:opc /opt/skp

  # --- Install Python dependencies ---
  - su - opc -c "pip3 install --user python-dotenv oci 2>/dev/null || true"

  # --- Wait for instance principal IAM policy propagation ---
  - sleep 60

  # --- Run deploy.py orchestrator ---
  - su - opc -c "cd /opt/skp && python3 deploy.py --component '${deploy_components}' --app-mode '${app_deploy_mode}' --no-deps 2>&1 | tee /opt/skp/stack-deploy.log"

  # --- Final status ---
  - su - opc -c "cd /opt/skp && python3 deploy.py --status" || true
  - echo "=== Stack deployment complete ==="
